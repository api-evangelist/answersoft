name: AnswerSoft
description: 'AnswerSoft, Inc. was a privately-held computer-telephony integration (CTI) software
  company based in Richardson, Texas. Its Concerto product line automated interactions between
  telephony systems and business applications, covering smart screen pop, intelligent call routing,
  data mining, and early internet-enabled call centers. Davox Corporation acquired AnswerSoft in a
  stock-for-stock transaction in 1998 to pair AnswerSoft''s inter-application automation with Davox''s
  Unison outbound call center line, taking the combined company into the emerging CRM market. Davox
  renamed itself Concerto Software in 2002, merged with Aspect Communications to form Aspect Software
  in 2005, and merged with Noble Systems to become Alvaria in 2021. AnswerSoft has not operated
  independently for over twenty-five years, publishes no API, developer program, or documentation, and
  the answersoft.com domain is now listed for sale on the GoDaddy aftermarket. This profile is retained
  as a historical acquired-company lead only.'
